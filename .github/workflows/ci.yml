name: CI

# =========================================================
#  Quand déclencher le workflow
# TODO : prendre ne compte la branche de develop et le branches de features ou fix, ...
# =========================================================
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  branches:
    - develop

jobs:

  # =======================================================
  #  Job 1 : Lint (vérification du style)
  # =======================================================
  # utiliser aussi mypy pour la vérification de types statique, c'est un super outil pour attraper les bugs avant même d'exécuter le code
  lint:
    name: 🎨 Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Ruff
        run: pip install ruff==0.7.1

      - name: 🔍 Run Ruff linter
        run: ruff check .

      - name: 🎨 Check formatting
        run: ruff format --check .

  # =========================================================
  #  Les jobs (ici un seul : tests)
  # =========================================================
  tests:
    name: 🧪 Run tests
    runs-on: ubuntu-latest

    # 🆕 Variables disponibles pour TOUS les steps du job
    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      # --- 1. Récupérer le code ---
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # --- 2. Installer Python ---
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --- 3. Installer les dépendances de dev ---
      # TODO : pensez à utiliser UV pour l'installation des dépendances, c'est plus rapide et plus fiable que pip dans un workflow GitHub Actions
      # TODO : vous pouvez aussi utiliser un cache pour les dépendances, ça accélère les runs après le premier
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --- 4. Lancer les tests ---
      - name: 🧪 Run pytest
        run: pytest -v