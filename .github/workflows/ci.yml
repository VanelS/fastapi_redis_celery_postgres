name: CI

# =========================================================
#  Quand déclencher le workflow
# =========================================================
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# =========================================================
#  Les jobs (ici un seul : tests)
# =========================================================
jobs:
  tests:
    name: 🧪 Run tests
    runs-on: ubuntu-latest

    steps:
      # --- 1. Récupérer le code ---
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # --- 2. Installer Python ---
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --- 3. Installer les dépendances de dev ---
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --- 4. Lancer les tests ---
      - name: 🧪 Run pytest
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest -v